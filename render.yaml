services:
  # FastAPI Backend Web Service
  - type: web
    name: github-knowledge-assistant-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PYTHONPATH
        value: .
      - key: HOST
        value: 0.0.0.0

  # React Frontend Static Site
  - type: web
    name: github-knowledge-assistant-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: github-knowledge-assistant-backend
          property: host
